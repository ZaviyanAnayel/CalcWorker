<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="cwBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="cwAccentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0066ff"/>
    </linearGradient>
    <filter id="cwShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0f172a" flood-opacity="0.45"/>
    </filter>
  </defs>
  
  <!-- Outer Rounded Squircle -->
  <rect x="32" y="32" width="448" height="448" rx="108" fill="url(#cwBgGrad)" filter="url(#cwShadow)"/>
  <rect x="34" y="34" width="444" height="444" rx="106" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="4"/>

  <!-- Calculator Screen Top Box -->
  <rect x="100" y="100" width="312" height="88" rx="24" fill="#0f172a" stroke="rgba(56,189,248,0.4)" stroke-width="3"/>
  <!-- Display Digits (Digital Matrix glow) -->
  <rect x="124" y="132" width="28" height="24" rx="4" fill="#38bdf8" opacity="0.9"/>
  <rect x="160" y="132" width="60" height="24" rx="4" fill="#38bdf8" opacity="0.9"/>
  <rect x="312" y="126" width="76" height="36" rx="6" fill="#38bdf8"/>
  <circle cx="286" cy="144" r="5" fill="#38bdf8"/>

  <!-- Calculator Button Keypad Grid -->
  <!-- Row 1 -->
  <rect x="100" y="216" width="62" height="62" rx="18" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.15)" stroke-width="2"/>
  <text x="131" y="255" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="700" fill="#ffffff" text-anchor="middle">7</text>
  
  <rect x="183" y="216" width="62" height="62" rx="18" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.15)" stroke-width="2"/>
  <text x="214" y="255" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="700" fill="#ffffff" text-anchor="middle">8</text>

  <rect x="266" y="216" width="62" height="62" rx="18" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.15)" stroke-width="2"/>
  <text x="297" y="255" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="700" fill="#ffffff" text-anchor="middle">9</text>

  <rect x="350" y="216" width="62" height="62" rx="18" fill="url(#cwAccentGrad)"/>
  <text x="381" y="255" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" fill="#ffffff" text-anchor="middle">÷</text>

  <!-- Row 2 -->
  <rect x="100" y="298" width="62" height="62" rx="18" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.15)" stroke-width="2"/>
  <text x="131" y="337" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
  
  <rect x="183" y="298" width="62" height="62" rx="18" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.15)" stroke-width="2"/>
  <text x="214" y="337" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="700" fill="#ffffff" text-anchor="middle">5</text>

  <rect x="266" y="298" width="62" height="62" rx="18" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.15)" stroke-width="2"/>
  <text x="297" y="337" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="700" fill="#ffffff" text-anchor="middle">6</text>

  <rect x="350" y="298" width="62" height="62" rx="18" fill="url(#cwAccentGrad)"/>
  <text x="381" y="337" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="800" fill="#ffffff" text-anchor="middle">×</text>

  <!-- Row 3 -->
  <rect x="100" y="380" width="62" height="62" rx="18" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.15)" stroke-width="2"/>
  <text x="131" y="419" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
  
  <rect x="183" y="380" width="62" height="62" rx="18" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.15)" stroke-width="2"/>
  <text x="214" y="419" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>

  <rect x="266" y="380" width="146" height="62" rx="18" fill="linear-gradient(135deg, #10b981, #059669)"/>
  <rect x="266" y="380" width="146" height="62" rx="18" fill="#10b981"/>
  <text x="339" y="420" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="900" fill="#ffffff" text-anchor="middle">=</text>
</svg>