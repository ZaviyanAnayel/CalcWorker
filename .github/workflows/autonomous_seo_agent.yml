name: 24/7 Autonomous AI SEO Agent

on:
  schedule:
    # Runs daily at 06:00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch: # Allows manual 1-click trigger from GitHub Actions tab

permissions:
  contents: write

jobs:
  publish-seo-article:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Autonomous SEO Agent
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python scripts/autonomous_cron_agent.py


      - name: Commit & Push New Articles and Sitemap
        run: |
          git config --global user.name "CalcWorker AI Agent"
          git config --global user.email "bot@calcworker.com"
          git add articles/ sitemap.xml
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 [AI SEO] Auto-published high-intent article & updated sitemap [skip ci]" && git push)
